{% load static %}<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#bd252a">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>{% block title %}Erro{% endblock %} · Gestão Financeira</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f5f5;color:#222;font:16px/1.6 system-ui,-apple-system,sans-serif;padding:24px}main{width:100%;max-width:600px;background:#fff;border:1px solid #e5e5e5;border-radius:12px;padding:48px}.brand{display:flex;align-items:center;gap:16px;margin-bottom:40px}.brand img{width:64px;height:64px;object-fit:contain}.brand span{font-size:12px;font-weight:700;letter-spacing:2px}.status{margin:0;color:#bd252a;font-size:64px;font-weight:700;line-height:1}h1{margin:16px 0;font-size:28px;line-height:1.3}p{color:#666}a{display:inline-block;margin-top:16px;padding:12px 20px;border-radius:8px;background:#bd252a;color:#fff;text-decoration:none;font-weight:600}a:hover{background:#a51f24}a:focus-visible{outline:3px solid #222;outline-offset:4px}@media(max-width:480px){body{padding:16px}main{padding:28px 24px}h1{font-size:24px}}
  </style>
</head>
<body>
  <main>
    <div class="brand"><img src="{% static 'img/logo_layout.png' %}" alt="Layout Sistemas"><span>GESTÃO FINANCEIRA</span></div>
    <p class="status">{% block status %}{% endblock %}</p>
    <h1>{% block heading %}{% endblock %}</h1>
    <p>{% block message %}{% endblock %}</p>
    <a href="/clientes/app/">Ir para o sistema</a>
  </main>
</body>
</html>
